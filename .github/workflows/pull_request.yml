name: Pull Request

# "This run was triggered by the "push" event, which is unsupported.
#  Please ensure you are using the "pull_request" event for this workflow."
on:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  dependency-review:
    uses: ./.github/workflows/dependency-review.yml
    permissions:
      contents: read
      pull-requests: read

  # XXX?
  pipx:
    name: pipx
    uses: percebus/github-actions-pipx/.github/workflows/run_pip-audit_path.yml@main

  npm:
    name: npm
    uses: percebus/github-actions-npm/.github/workflows/audit.yml@main
