name: "Re-Usable: run {cmd}"

on:
  workflow_call:
    secrets:
      ssh-private-key:
        description: SSH private key
        required: false

    inputs:
      # TODO add uv version

      working-directory:
        description: pwd
        type: string
        required: false
        default: .

      audit:
        description: uv tool audit
        type: boolean
        required: false
        default: true

      audit_continue-on-error:
        description: continue on error
        type: boolean
        required: false
        default: false

      tools-requirements-file:
        description: '"uv tool install -r {file}" of sorts'
        type: string
        required: false
        default: requirements.uv.tool.txt

      uv_tool_install_cli_options:
        description: uv tool install --help
        type: string
        required: false
        default: --force --preview-features tool-install-locks

      uv_tool_audit_cli_options:
        description: uv tool audit --help
        type: string
        required: false
        default: --all --preview-features audit

      uv_sync_cli_options:
        description: uv sync --help
        type: string
        required: false
        default: --locked --all-groups

      cmd:
        description: command to be run
        type: string
        required: true

permissions:
  contents: read

jobs:
  run_cmd:
    name: ${{ inputs.cmd }}
    runs-on: ubuntu-latest
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
        with:
          ssh-private-key: ${{ secrets.ssh-private-key }}

      - uses: percebus/github-actions-uv/.github/actions/setup@main

      - uses: percebus/github-actions-uv/.github/actions/install@main
        with:
          audit: ${{ inputs.audit && 'true' || 'false '}}
          audit_continue-on-error: ${{ inputs.audit_continue-on-error && 'true' || 'false '}} # TODO
          tools-requirements-file: ${{ inputs.tools-requirements-file }}
          uv_tool_install_cli_options: ${{ inputs.uv_tool_install_cli_options }}
          uv_tool_audit_cli_options: ${{ inputs.uv_tool_audit_cli_options }}
          uv_sync_cli_options: ${{ inputs.uv_sync_cli_options }}

      - name: ${{ inputs.cmd }}
        run: ${{ inputs.cmd }}
