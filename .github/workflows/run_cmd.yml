name: run cmd

on:
  workflow_call:
    inpus:
      cmd:
        description: command to be run
        type: string
        required: true
  
  pull_request:
  push:
    branches:
      - main

# concurrency:
#   group: TODO
#   cancel-in-progress: true

permissions:
  contents: read

jobs:
  run_cmd:
    name: run cmd
    runs-on: ubuntu-latest
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: percebus/github-actions-uv/.github/actions/setup
      - uses: percebus/github-actions-uv/.github/actions/tool_install
      - uses: percebus/github-actions-uv/.github/actions/python_install
      
      - name: ${{ inputs.cmd }}
        run: cd ./ && ${{ inputs.cmd }}
  
