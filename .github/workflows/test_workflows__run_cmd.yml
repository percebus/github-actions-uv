name: Test workflows/run_cmd

on:
  workflow_dispatch: 
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cmd__matrix:
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        cmd:
          - "echo 'hi'"
    name: run
    uses: ./.github/workflows/run_cmd.yml
    with:
      cmd: ${{ matrix.cmd }}
