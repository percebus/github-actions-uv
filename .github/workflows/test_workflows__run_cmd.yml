name: Test workflows/run_cmd

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/test_workflows__run_cmd.yml
      - .github/workflows/run_cmd.yml
      - .github/workflows/actions.lock
      - .github/actions/**
      - assets/uv/**
      - "*"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  cmd__matrix:
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        cmd:
          - "echo 'hi'"
    name: run
    uses: ./.github/workflows/run_cmd.yml
    with:
      cmd: ${{ matrix.cmd }}

  uv_tool__matrix:
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        cmd:
          - pyclean .
          - uvx pyclean .

    name: run
    uses: ./.github/workflows/run_cmd.yml
    with:
      cmd: ${{ matrix.cmd }}
