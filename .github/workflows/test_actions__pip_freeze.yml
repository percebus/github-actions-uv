name: Test actions/pip_freeze

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  pull_request:
    paths:
      - .github/workflows/test_actions__pip_freeze.yml
      - .github/workflows/actions.lock
      - .github/actions/setup/**
      - .github/actions/python_install/**
      - .github/actions/pip_freeze/**
      - assets/uv_python/**
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: $/.github/actions/setup
      - uses: $/.github/actions/python_install
      - uses: $/.github/actions/pip_freeze

  uv_python__matrix:
    needs: default
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python-version:
          - "3.12.x"
          - "3.13.x"
          - "3.x"

    name: uv python @ ${{ matrix.python-version }}
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: $/.github/actions/setup
      - uses: $/.github/actions/python_install
        with:
          working-directory: assets/uv_python/${{ matrix.python-version }}

      - uses: $/.github/actions/pip_freeze

  # Override .python-version(s) with github-actions-python/.../setup
  python__matrix:
    needs: default
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python-version:
          # - "3.10" # XXX old
          # - "3.11" # XXX old
          - "3.12"
          - "3.13"
          - "3.14"

    name: python @ ${{ matrix.python-version }}
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main

      - uses: percebus/github-actions-python/.github/actions/setup@main
        with:
          python-version: ${{ matrix.python-version }}

      - uses: $/.github/actions/setup
      - uses: $/.github/actions/pip_freeze
