name: "Re-Usable: uv-bump"

on:
  workflow_call:
    secrets:
      ssh-private-key:
        description: SSH private key
        required: false

    inputs:
      working-directory:
        description: pwd
        type: string
        required: false
        default: .

      ref_name:
        description: peter-evans/create-pull-request branch
        type: string
        required: false
        default: automation/uv-bump

      commit-message:
        description: peter-evans/create-pull-request commit-message
        type: string
        required: false
        default: "fix(deps): uv-bump"

      pull_request_title:
        description: peter-evans/create-pull-request title
        type: string
        required: false
        default: "fix(deps): uv-bump"

      pull_request_body:
        description:
        type: string
        required: false
        default: |
          Automated security updates generated by `uv-bump`.

          Please review the changes to the `uv.lock` (and/or `pyproject.toml`) to ensure compatibility.

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
        with:
          ssh-private-key: ${{ secrets.ssh-private-key }}

      - uses: percebus/github-actions-uv/.github/actions/setup@main

      - name: uv-bump
        #
        # alternatively
        # run: uvx uv-bump --pyprojecy-toml ${{ secrets.working-directory }}/pyproject.toml
        #
        working-directory: ${{ secrets.working-directory }}
        run: uvx uv-bump

      # TODO? move to -commons? create a -github?
      # SRC: https://github.com/peter-evans/create-pull-request/
      - uses: peter-evans/create-pull-request@v8.1.1
        name: Create Pull Request
        with:
          branch: ${{ inputs.ref_name }}
          commit-message: ${{ inputs.commit-message }}
          title: ${{ inputs.pull_request_title }}
          body: ${{ inputs.pull_request_body }}
          delete-branch: true
          labels: |
            security
            dependencies
            pyproject.toml
            uv.lock
