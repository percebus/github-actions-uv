name: Test workflows/audit

on:
  pull_request:
    paths:
      - ./.github/workflows/test_workflows__audit.yml
      - ./.github/actions/**
      - ./assets/uv/**
      - ./*
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  # XXX: tested in pull_request
  # default:
  #   name: uv
  #   uses: ./.github/workflows/audit.yml

  pyproject__matrix:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        project:
          - a2a-client-py
          - ai-evaluator-py
          - agent-framework-sampler-py

    name: ${{ matrix.project }}/pyproject.toml
    uses: ./.github/workflows/audit.yml
    with:
      working-directory: ./assets/uv/${{ matrix.project }}
      continue-on-error: true
