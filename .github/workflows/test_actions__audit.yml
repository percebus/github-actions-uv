name: Test actions/audit

on:
  pull_request:
  push:
    branches:
    - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  default:
    name: default
    runs-on: ubuntu-latest
    steps:
      - name: uv
        uses: ./.github/actions/audit
