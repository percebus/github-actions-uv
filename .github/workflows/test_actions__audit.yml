name: Test actions/audit

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  default:
    name: default
    runs-on: ubuntu-latest
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: $/.github/actions/setup

      - name: uv audit
        uses: $/.github/actions/audit

  pyproject__matrix:
    needs: default
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        project:
          - a2a-client-py
          - agent-framework-sampler-py
          - ai-evaluator-py

    name: ${{ matrix.project }}/pyproject.toml
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: $/.github/actions/setup
      - uses: $/.github/actions/audit
        with:
          working-directory: ./assets/uv/${{ matrix.project }}
          continue-on-error: true
