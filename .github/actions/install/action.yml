name: uv * install
description: uv install

inputs:
  working-directory:
    description: Working directory
    required: false
    default: .

  uv_tool_install_cli_options:
    description: uv tool install --help
    required: false
    default: --force --preview-features tool-install-locks

  tools-requirements-file:
    description: '"uv tool install -r {file}" of sorts'
    required: false
    default: requirements.uv.tool.txt

  uv_tool_audit_cli_options:
    description: uv tool audit --help
    required: false
    default: --all --preview-features audit

  audit:
    description: uv tool audit
    required: false
    default: "true"

  audit_continue-on-error:
    description: continue on error
    required: false
    default: "true"

  uv_audit_cli_options:
    description: uv audit {options}
    type: string
    required: false
    default: --locked --preview-features audit-command

  uv_sync_cli_options:
    description: CLI options for uv sync
    required: false
    default: "--locked --all-groups"

runs:
  using: composite
  steps:
    - name: uv tool install
      if: ${{ inputs.tools-requirements-file != '' }}
      uses: percebus/github-actions-uv/.github/actions/tool_install@main
      with:
        uv_tool_install_cli_options: ${{ inputs.uv_tool_install_cli_options }}
        requirements-file: ${{ inputs.working-directory }}/${{ inputs.tools-requirements-file }}
        audit: ${{ inputs.audit }}
        continue-on-error: ${{ inputs.audit_continue-on-error }}

    - name: uv python install
      uses: percebus/github-actions-uv/.github/actions/python_install@main
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: uv audit
      uses: percebus/github-actions-uv/.github/actions/audit@main
      continue-on-error: ${{ inputs.audit_continue-on-error }}
      with:
        working-directory: ${{ inputs.working-directory }}
        uv_audit_cli_options: ${{ inputs.uv_audit_cli_options }}
        continue-on-error: ${{ inputs.audit_continue-on-error && 'true' || 'false' }}

    - name: uv sync
      uses: percebus/github-actions-uv/.github/actions/sync@main
      with:
        working-directory: ${{ inputs.working-directory }}
        uv_sync_cli_options: ${{ inputs.uv_sync_cli_options }}

    # TODO? add pip_freeze
