name: setup-uv
description: setup uv

inputs:
  version:
    description: uv version
    required: false
    default: "0.13.3"

runs:
  using: composite
  steps:
    # TODO SHA commit
    - uses: astral-sh/setup-uv@v5
      name: uv @ ${{ inputs.version }}  
      with:
        version: ${{ inputs.version }}

    - name: uv --version
      shell: bash
      run: uv --version
