name: setup-uv
description: setup uv

inputs:
  version:
    description: uv version
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.3
      name: uv @ ${{ inputs.version }}
      with:
        version: ${{ inputs.version }}

    - name: uv --version
      shell: bash
      run: uv --version
