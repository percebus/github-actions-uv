name: uv tool install
description: uv tool install

inputs:
  uv_tool_install_cli_options:
    description: uv tool insall --help
    required: false
    default: --force --preview-features tool-install-locks

  requirements-file:
    description: '"uv tool install -r {file}" of sorts'
    required: false
    default: requirements.uv.tool.txt

  # TODO? RENAME? uv_tool_audit ?
  audit:
    description: uv tool audit
    required: false
    default: "true"

  uv_tool_audit_cli_options:
    description: uv tool audit --help
    required: false
    default: --all --preview-features audit

  continue-on-error:
    description: continue on error
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: cat ${{ inputs.requirements-file }}
      shell: bash
      run: cat ${{ inputs.requirements-file }}

    - name: uv tool install
      shell: bash
      run: cat ${{ inputs.requirements-file }} | sed 's/.*/"&"/' | xargs -n 1 uv tool install ${{ inputs.uv_tool_install_cli_options }}

    - name: uv tool list
      shell: bash
      run: uv tool list

    - name: uv tool audit
      if: ${{ inputs.audit == 'true' }}
      run: uv tool audit ${{ inputs.uv_tool_audit_cli_options }}
      shell: bash
      continue-on-error: ${{ inputs.continue-on-error == 'true' }}
